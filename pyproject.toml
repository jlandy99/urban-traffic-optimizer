[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-traffic-optimizer"
version = "0.1.0"
description = "Urban transportation infrastructure and traffic control optimization"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pydantic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
